# Hermes Wear Kit — the catalog entry (plugin-catalog/wearos.yaml) pins the MIRROR repo
# borealBytes/hermes-wearos-plugin: a git subtree split of THIS directory, force-published
# by .github/workflows/plugin-sync.yml in the monorepo on every merge. Zero human commits
# in the mirror; edit here, never there. (shape C, handoff 2026-11-08.)
# Manifest surface verified against hermes-agent v0.23.0 (hermes_cli/plugins_manifest.py
# _KNOWN_MANIFEST_FIELDS; capabilities probe in hermes_cli/plugin_validate.py). The
# desktop pane reads dashboard/plugin_api.py via ctx.rest (hot-mounted — core's own
# test_plugin_api_hot_mount proves the first request serves without an app restart);
# the pane has NO tool-call door (measured: src/sdk/index.ts `host` has none), which is
# why this backend half exists at all.
# Admission-rule mapping: secrets via config_schema/requires_env only (rule 11); full
# disclosures in README.md (rule 13); requires_hermes floor re-checked against the release
# current at PR time (rule 14); zero committed binaries in the pinned tree (rule 17 — the
# mirror split is born without app/libs/hermes-tailnet.aar, and the Parakeet engine is
# BUILT from pinned source on the user's machine, never shipped).
name: wearos
version: 0.3.0
description: >-
  ⌚ Pairs the Hermes Wear OS watch app over the watch's OWN tailnet node — the gateway
  issues a 6-digit code, a human types it back at the gateway (never through a model);
  no phone app, no relay. Per-agent key grants, real watch_send delivery, cron-run
  notifications, and one-command full revoke (tailnet node + token + key rotation).
  Voice-out: your agents speak on the wrist with cloned zero-shot voices (NeuTTS Air,
  Apache-2.0) — a Desktop pane dropdown picks the weights source (community re-quants
  default, no account; official gated rows for consent-keepers), separate gateway and
  watch quants, word-synced karaoke, all audio served over your own tailnet. Optional
  streaming speech-to-text builds itself from pinned source. 𝗢𝗽𝗲𝗻 𝘀𝗼𝘂𝗿𝗰𝗲
  𝗳𝗼𝗿𝗲𝘃𝗲𝗿 — full walkthrough: https://github.com/borealBytes/hermes-wearos
author: "Clay (borealBytes)"
kind: standalone
platforms:
  - linux
  - macos
license: MIT
homepage: https://github.com/borealBytes/hermes-wearos/tree/main/hermes-plugin
tags:
  - wearos
  - tailscale
  - pairing
  - devices
  - voice
  - tts
# Floor raised for the desktop data plane: ctx.rest + hot-mounted plugin_api are
# MEASURED on v0.23.0 (2026.9.24); v0.22 is unverified for them, so we don't claim it.
requires_hermes: ">=0.23.0"
# Stdlib-only (urllib, no pip deps); mermaid rendering arrives in media.py — keep it so,
# or declare python_dependencies with oldest-workable floor + upper bound (rule 10).
requires_env:
  - API_SERVER_KEY        # delivered to enrolled watches over the private tailnet lane
                          # (review fix: declared, read in this plugin's own profile scope)
provides_tools:
  - watch_send
  - watch_status
  - watch_pair
provides_hooks:
  - on_session_end        # cron-run → watch notifications (D14); queue-only, never raises
config_schema:
  tailnet:
    type: str
    description: >-
      Tailnet handle as used by the Tailscale admin console (e.g. "example.ts.example");
      the plugin accepts and validates it live before anything else.
  tailscale_api_token:
    type: secret
    description: >-
      Tailscale API token (Owner or Admin role) used to mint one-use enrollment keys,
      read/patch tailnet prefs, and DELETE a revoked watch's node. Alternative to the
      OAuth client pair below.
  tailscale_oauth_client_id:
    type: str
    description: >-
      Optional OAuth client id (preferred over a personal token): scopes auth_keys +
      devices:core (write covers revoke's node deletion) + dns:read + a policy-file
      READ grant, restricted to the watch tag so the plugin can only ever mint keys
      carrying that tag.
  tailscale_oauth_client_secret:
    type: secret
    description: Secret for tailscale_oauth_client_id; exchanged via client_credentials.
  watch_tag:
    type: str
    default: "tag:hermes-watch"
    description: ACL tag stamped on every watch node the plugin enrolls (ACL hygiene).
  key_expiry:
    type: str
    default: "24h"
    description: Expiry window for the single-use enrollment key handed to a watch.
  watchkit_token:
    type: secret
    description: >-
      Optional watchkit helper bearer handed to enrolled watches on the private lane
      (nullable field "watchkit_token"); leave unset if watchkit isn't deployed.
  hf_token:
    type: secret
    env: HF_TOKEN
    description: >-
      Hugging Face read token for the voice-out weights (ONLY needed when a
      gated official row is selected — the community default needs no account).
      One-time consent click at the model page, then paste here or in the pane.
      Read through this plugin's declared secret route (profile-scoped); the
      pane's token box stores it 0600 in the plugin's own data dir; never
      echoed by any route, never logged.
  claim_port:
    type: int
    default: 42653
    description: >-
      Loopback port of the funnel-facing claim door (127.0.0.1 only; tailscale funnel
      fronts /pair/*). Change both together if 42653 is taken.
  private_port:
    type: int
    default: 42654
    description: >-
      Port of the PRIVATE lane bound to this machine's tailnet IP (never 0.0.0.0,
      never funneled): credential delivery, watch_send outbox, cron alerts, self-unpair.
      Change both together if 42654 is taken.
  apk_release_url:
    type: str
    default: "https://github.com/borealBytes/hermes-wearos/releases/latest"
    description: Where "install the watch app" points (CI-built APK + SHA256SUMS).
