name: Preview APK build

# Owner-gated preview builds (owner doctrine 2026-11-09): a PR is built on GitHub —
# and its APK is an installable artifact — ONLY when someone with triage applies the
# `preview-build` label. The label is the trigger; the PR head's copy of THIS file is
# what runs (so the workflow reaches the first PR that adds it).
#
# The job declares the GitHub Environment `preview-build`. Today it runs straight
# through; the moment the owner adds themselves as a *required reviewer* on that
# environment (Settings ▸ Environments ▸ preview-build), every preview build waits
# for an explicit human approve — a gate only the owner can open, no code change.
#
# What it validates: the FULL chain a fresh clone would walk — JVM unit tests + a
# real assembleDebug of the committed tree (the tsnet AAR is committed, so CI needs
# neither Go nor the NDK). Artifact: app-debug.apk + SHA256SUMS.txt.

on:
  pull_request:
    types: [labeled, synchronize, reopened]

jobs:
  apk:
    if: contains(github.event.pull_request.labels.*.name, 'preview-build')
    runs-on: ubuntu-latest
    environment: preview-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Tests (JVM-only, no device)
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Checksum the artifact
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: preview-apk-pr-${{ github.event.pull_request.number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
