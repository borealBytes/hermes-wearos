name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-tests:
    name: Android unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 17: AGENTS.md §1 / scripts/env.sh pin java-17-openjdk; app/build.gradle.kts
      # sets sourceCompatibility/targetCompatibility/jvmTarget to 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # compileSdk 35 (app/build.gradle.kts) + build-tools default for AGP 8.7.3
      # (gradle/libs.versions.toml). setup-android exports ANDROID_HOME/ANDROID_SDK_ROOT
      # and accepts the SDK licenses.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # No Gradle wrapper is committed (gradle/ carries only libs.versions.toml);
      # pinned to the version the local devkit runs (../devkit/gradle/gradle-8.13).
      # Also enables dependency-cache. The action puts `gradle` on PATH for later steps.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          # (v4 dropped the old `arguments:` probe param — the pin is proven by the
          # first real gradle invocation below failing loudly if it's wrong)

      # The ~52 JVM-only tests (app/src/test/) — CONTRIBUTING.md: "JVM suite must stay green".
      # No --offline here: CI resolves from google()/mavenCentral() normally.
      - name: Unit tests
        run: gradle --console=plain :app:testDebugUnitTest

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 7

  go-shim:
    name: Go tailnet shim (vet + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tailnet/go
    steps:
      - uses: actions/checkout@v4

      # Resolves `go 1.27.3` from tailnet/go/go.mod (module hermes.dev/tailnet).
      - uses: actions/setup-go@v5
        with:
          go-version-file: tailnet/go/go.mod

      # No *_test.go exists today, so vet + build is the gate; go test is wired so
      # tests run automatically the moment one lands.
      # cmd/smoketest needs TS_AUTHKEY + a live tailnet → built, never run.
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...

  node-watchkit:
    name: Watchkit .mjs syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches local node v22 (v22.22.3). watchkit has zero npm deps (no package.json;
      # only node: builtins), so `node --check` is a real parse gate, not a formality.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check every .mjs
        run: |
          shopt -s nullglob
          for f in server/watchkit/*.mjs; do
            echo "::group::$f"
            node --check "$f"
            echo "::endgroup::"
          done

  shell-syntax:
    name: scripts/*.sh syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n every script
        run: |
          shopt -s nullglob
          for f in scripts/*.sh; do
            bash -n "$f"
            echo "ok  $f"
          done
