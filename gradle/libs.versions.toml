[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.13.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
wearCompose = "1.4.1"
wear = "1.3.0"
# Explicit fragment floor: a transitive 1.2.x trips lintVitalRelease
# (InvalidFragmentVersionForActivityResult, MainActivity notification-permission
# launcher). The release-APK lane is the only place this lint runs, so JVM tests
# stayed green while the preview roll reddened. 1.8.x is the compileSdk-35 train.
fragment = "1.8.5"
okhttp = "4.12.0"
serializationJson = "1.7.3"
datastore = "1.1.1"
work = "2.9.1"
composeFoundation = "1.7.6"
vosk = "0.3.47"
media3 = "1.4.1"
# Tiles/complications pinned to the 1.4.x/1.2.x trains (task-allowed "1.4.x ok"): the newest
# stable wear-tiles is 1.6.2 but its Kotlin 2.1/metadata-2.1.0 chain needs a newer Kotlin than
# 2.0.21 here; 1.4.1 is the last release fully compatible with this stack.
tiles = "1.4.1"
watchfaceComplications = "1.2.1"
# W1-W4 body tools. 1.0.0 is the last build whose Kotlin metadata our Kotlin 2.0.21 accepts
# (1.1.0 is compiled with kotlin-stdlib 2.1.20 → metadata 2.1.0, same blocker as wear-tiles 1.6.2).
healthServices = "1.0.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version = "1.0.1" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-wear-compose-material = { group = "androidx.wear.compose", name = "compose-material", version.ref = "wearCompose" }
androidx-wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "composeFoundation" }
androidx-wear-tooling-preview = { group = "androidx.wear", name = "wear-tooling-preview", version = "1.0.0" }
androidx-wear = { group = "androidx.wear", name = "wear", version.ref = "wear" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-sse = { group = "com.squareup.okhttp3", name = "okhttp-sse", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
vosk-android = { group = "com.alphacephei", name = "vosk-android", version.ref = "vosk" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-wear-tiles = { group = "androidx.wear.tiles", name = "tiles", version.ref = "tiles" }
androidx-wear-tiles-material = { group = "androidx.wear.tiles", name = "tiles-material", version.ref = "tiles" }
androidx-wear-tiles-tooling = { group = "androidx.wear.tiles", name = "tiles-tooling", version.ref = "tiles" }
androidx-wear-watchface-complications-data-source = { group = "androidx.wear.watchface", name = "watchface-complications-data-source", version.ref = "watchfaceComplications" }
androidx-wear-watchface-complications-data-source-ktx = { group = "androidx.wear.watchface", name = "watchface-complications-data-source-ktx", version.ref = "watchfaceComplications" }
androidx-health-services-client = { group = "androidx.health", name = "health-services-client", version.ref = "healthServices" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
