<!doctype html><html><head><meta charset=utf-8><style>
*{margin:0;box-sizing:border-box}
html,body{width:466px;height:466px;background:#000;font-family:'Roboto','Google Sans',system-ui,sans-serif;color:#fff;overflow:hidden}
.screen{position:relative;width:466px;height:466px;padding:26px 68px 0}
.status{color:#8A8A8A;font-size:12px;text-align:center}
.bug{position:absolute;top:8px;right:96px;font-size:10px;color:#4A4F55}
.scrollcue{position:absolute;right:52px;top:150px;height:170px;width:4px;border-radius:2px;background:#22252B}
.scrollcue i{position:absolute;top:60px;width:4px;height:48px;border-radius:2px;background:#7A9CC6}
.kara{position:absolute;top:0;left:68px;right:68px;height:466px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left}
.line{font-size:15.5px;line-height:1.7;margin:3px 0}
.said{color:#B9BEC4}
.now span{background:#2E4B6E;color:#fff;padding:2px 8px;border-radius:8px}
.next{color:#5A5F66}
.next2{color:#3E4247}
.player{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center}
.orbwrap{position:relative;width:110px;height:110px}
.orbwrap img{width:110px;height:110px;border-radius:50%;display:block;filter:drop-shadow(0 0 12px rgba(192,57,43,.35))}
.time{position:absolute;left:0;right:0;bottom:11px;text-align:center;font-size:10.5px;font-weight:500;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 7px rgba(40,6,4,.9);letter-spacing:.4px}
</style></head><body><div class=screen>
<div class=bug>v0.9.0 · wear-demo · mock</div>
<div class=status>On watch · sentence karaoke ✓</div>
<div class=kara>
  <div class="line said">Your cron digest: three farm alerts,</div>
  <div class="line now"><span>no incidents, sprayer window opens Thursday 06:10.</span></div>
  <div class="line next">Milk prices held flat;</div>
  <div class="line next2">soil report attached.</div>
</div>
<div class=scrollcue><i></i></div>
<div class=player>
  <div class=orbwrap><svg width="156" height="156" viewBox="0 0 156 156" style="position:absolute;left:-23px;top:-23px"><circle cx="78" cy="78" r="56.5" fill="none" stroke="rgba(158,66,56,0.95)" stroke-width="5"/><path d="M78.0,134.5 A56.5,56.5 0 0,1 63.9,23.3" fill="none" stroke="#C0392B" stroke-width="5" stroke-linecap="round"/></svg><img src="orb-real.png"><div class=time>0:04 / 0:09</div></div>
</div>
</div></body></html>
